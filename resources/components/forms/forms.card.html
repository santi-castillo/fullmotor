<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-app); padding: 26px 30px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; align-items: start; }
  .full { grid-column: 1 / -1; }
  .chips { display: flex; gap: 9px; flex-wrap: wrap; }
  [data-lucide] { width: 16px; height: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Select, FilterChip } = window.TodoMotorDesignSystem_d01d9d;
  const I = ({ n }) => <i data-lucide={n}></i>;
  function Demo() {
    const [cat, setCat] = React.useState('suvs');
    React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
    return (
      <div className="grid">
        <Input label="Buscar" placeholder="Marca o modelo…" iconLeft={<I n="search" />} />
        <label style={{display:'flex',flexDirection:'column',gap:'6px'}}>
          <span style={{fontFamily:'var(--font-sans)',fontSize:'var(--text-sm)',fontWeight:600,color:'var(--text-strong)'}}>Ordenar</span>
          <Select placeholder="Ordenar por" options={['Precio: menor a mayor', 'Más nuevos', 'Más potentes']} />
        </label>
        <Input label="Email" defaultValue="hola@" error="Ingresá un email válido" />
        <Input label="Teléfono" placeholder="099 123 456" iconRight={<I n="check" />} />
        <div className="full chips">
          <FilterChip active={cat==='all'} onClick={()=>setCat('all')} count={1150}>Todos</FilterChip>
          <FilterChip active={cat==='autos'} onClick={()=>setCat('autos')} count={304} icon={<I n="car" />}>Autos</FilterChip>
          <FilterChip active={cat==='suvs'} onClick={()=>setCat('suvs')} count={566} icon={<I n="caravan" />}>SUVs</FilterChip>
          <FilterChip active={cat==='pickups'} onClick={()=>setCat('pickups')} count={185} icon={<I n="truck" />}>Camionetas</FilterChip>
          <FilterChip active={cat==='motos'} onClick={()=>setCat('motos')} count={91} icon={<I n="bike" />}>Motos</FilterChip>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
