<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-app); padding: 28px 30px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); width: 70px; flex: none; }
  [data-lucide] { width: 17px; height: 17px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button } = window.TodoMotorDesignSystem_d01d9d;
  const I = ({ n }) => <i data-lucide={n}></i>;
  function Demo() {
    React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
    return (
      <div className="stack">
        <div className="row"><span className="lbl">Variants</span>
          <Button>Ver ficha</Button>
          <Button variant="secondary">Comparar</Button>
          <Button variant="ghost">Cancelar</Button>
          <Button variant="soft">Guardar</Button>
          <Button variant="danger">Quitar</Button>
        </div>
        <div className="row"><span className="lbl">Sizes</span>
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg" iconRight={<I n="arrow-right" />}>Large</Button>
        </div>
        <div className="row"><span className="lbl">Icon</span>
          <Button iconLeft={<I n="sliders-horizontal" />}>Filtros</Button>
          <Button variant="secondary" iconOnly iconLeft={<I n="heart" />} aria-label="Guardar" />
          <Button variant="secondary" iconOnly iconLeft={<I n="share-2" />} aria-label="Compartir" />
        </div>
        <div className="row"><span className="lbl">State</span>
          <Button loading>Cargando</Button>
          <Button disabled>Disabled</Button>
          <Button variant="secondary" disabled>Disabled</Button>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
