<!-- @dsCard group="Type" viewport="700x230" name="Body & UI — Hanken Grotesk" subtitle="Paragraphs, labels, controls · 400–700" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface); padding: 28px 32px; }
  .ey { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }
  p { font-family: var(--font-sans); color: var(--text-body); font-size: 16px; line-height: 1.55; margin: 0; max-width: 60ch; }
  .weights { display: flex; gap: 24px; margin-top: 18px; align-items: baseline; flex-wrap: wrap; }
  .weights span { font-family: var(--font-sans); color: var(--text-strong); font-size: 19px; }
  .w4 { font-weight: 400; } .w5 { font-weight: 500; } .w6 { font-weight: 600; } .w7 { font-weight: 700; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); margin-left: 6px; }
</style>
</head>
<body>
  <div class="ey">Body & UI / Hanken Grotesk</div>
  <p>La Volkswagen Taos Highline llega con motor 250 TSI de 1.4 litros y 150 HP. Equipamiento completo, caja automática y un precio de referencia competitivo para el segmento SUV mediano.</p>
  <div class="weights">
    <span class="w4">Regular<span class="tag">400</span></span>
    <span class="w5">Medium<span class="tag">500</span></span>
    <span class="w6">Semibold<span class="tag">600</span></span>
    <span class="w7">Bold<span class="tag">700</span></span>
  </div>
</body>
</html>
