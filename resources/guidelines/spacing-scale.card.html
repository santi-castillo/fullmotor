<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px base · 1 → 13" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface); padding: 28px 30px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { width: 26px; background: var(--accent-soft); border-bottom: 3px solid var(--accent); border-radius: var(--radius-xs) var(--radius-xs) 0 0; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-strong); }
  .px { font-family: var(--font-mono); font-size: 9.5px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:8px"></div><span class="tok">2</span><span class="px">8</span></div>
    <div class="item"><div class="bar" style="height:12px"></div><span class="tok">3</span><span class="px">12</span></div>
    <div class="item"><div class="bar" style="height:16px"></div><span class="tok">4</span><span class="px">16</span></div>
    <div class="item"><div class="bar" style="height:24px"></div><span class="tok">6</span><span class="px">24</span></div>
    <div class="item"><div class="bar" style="height:32px"></div><span class="tok">7</span><span class="px">32</span></div>
    <div class="item"><div class="bar" style="height:48px"></div><span class="tok">9</span><span class="px">48</span></div>
    <div class="item"><div class="bar" style="height:64px"></div><span class="tok">10</span><span class="px">64</span></div>
    <div class="item"><div class="bar" style="height:80px"></div><span class="tok">11</span><span class="px">80</span></div>
  </div>
</body>
</html>
