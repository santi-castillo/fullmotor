<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface); padding: 24px 32px; }
  .row { display: flex; align-items: baseline; gap: 18px; padding: 6px 0; border-bottom: 1px solid var(--hairline); }
  .row:last-child { border-bottom: 0; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); width: 78px; flex: none; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 48px; flex: none; text-align: right; }
  .samp { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="row"><span class="tok">6xl</span><span class="px">84</span><span class="samp" style="font-size:42px">Taos</span></div>
  <div class="row"><span class="tok">4xl</span><span class="px">48</span><span class="samp" style="font-size:38px">Encontrá tu auto</span></div>
  <div class="row"><span class="tok">2xl</span><span class="px">28</span><span class="samp" style="font-size:28px">Destacados de la semana</span></div>
  <div class="row"><span class="tok">xl</span><span class="px">22</span><span class="samp" style="font-size:22px">Ficha técnica completa</span></div>
  <div class="row"><span class="tok">md</span><span class="px">16</span><span class="samp" style="font-size:16px;font-family:var(--font-sans);font-weight:500">Body — Hanken Grotesk Medium</span></div>
  <div class="row"><span class="tok">sm</span><span class="px">13</span><span class="samp" style="font-size:13px;font-family:var(--font-mono);font-weight:400;letter-spacing:0">USD 42.390 · 150 HP · NAFTA</span></div>
</body>
</html>
