<!-- @dsCard group="Type" viewport="700x230" name="Data & price — JetBrains Mono" subtitle="Specs, prices, VIN — the ficha técnica voice" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface); padding: 28px 32px; }
  .ey { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 16px; }
  .price { font-family: var(--font-mono); font-weight: 500; font-size: 38px; color: var(--text-strong); letter-spacing: -0.01em; }
  .cur { font-size: 18px; color: var(--text-muted); }
  .specs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 24px; margin-top: 20px; }
  .specs dt { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 4px; }
  .specs dd { font-family: var(--font-mono); font-size: 17px; color: var(--text-strong); margin: 0; font-feature-settings: "tnum"; }
</style>
</head>
<body>
  <div class="ey">Data & price / JetBrains Mono · tabular</div>
  <div class="price"><span class="cur">USD</span> 42.390</div>
  <dl class="specs">
    <div><dt>Año</dt><dd>2026</dd></div>
    <div><dt>Potencia</dt><dd>150 HP</dd></div>
    <div><dt>Motor</dt><dd>1.4 TSI</dd></div>
    <div><dt>0–100</dt><dd>8.9 s</dd></div>
  </dl>
</body>
</html>
