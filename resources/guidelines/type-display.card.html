<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface); padding: 28px 32px; }
  .ey { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }
  .big { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; color: var(--text-strong); font-size: 56px; margin: 0; }
  .sub { font-family: var(--font-display); font-weight: 500; letter-spacing: -0.015em; color: var(--text-body); font-size: 24px; margin: 12px 0 0; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 16px; display: flex; gap: 20px; }
</style>
</head>
<body>
  <div class="ey">Display / Space Grotesk</div>
  <h1 class="big">Encontrá tu próximo vehículo</h1>
  <div class="sub">Fichas técnicas, precios y comparativas</div>
  <div class="meta"><span>Bold 700</span><span>Medium 500</span><span>tracking −3%</span></div>
</body>
</html>
